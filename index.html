<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Saeed & Salha — Trip Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FDFAF5;--dark:#12100A;--gold:#C8A96E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--cream);color:var(--dark)}
body{display:flex;flex-direction:column;height:100dvh}

.city-bar{display:flex;background:#0E0C07;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.city-btn{flex:1;padding:11px 6px 9px;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;color:rgba(255,255,255,0.3);position:relative;transition:color 0.2s}
.city-btn.active{color:white}
.city-btn::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;border-radius:2px;opacity:0;transition:opacity 0.2s}
.city-btn.active::after{opacity:1}
.city-btn[data-city="paris"].active::after{background:#BF3B3B}
.city-btn[data-city="london"].active::after{background:#C41E3A}
.city-flag{font-size:15px;display:block;margin-bottom:1px}

.header{padding:12px 14px 0;flex-shrink:0;box-shadow:0 4px 24px rgba(0,0,0,0.35)}
.header.paris{background:linear-gradient(160deg,#1A0E0E,#0D0905)}
.header.london{background:linear-gradient(160deg,#0D1520,#060C14)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.header-title h1{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1}
.paris .header-title h1{color:#E8C87A}
.london .header-title h1{color:#F0F0F0}
.london .header-title h1 span{color:#C41E3A}
.header-title p{font-size:9px;color:rgba(255,255,255,0.3);margin-top:3px;letter-spacing:0.12em;text-transform:uppercase}
.place-count{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:5px 10px;text-align:center}
.place-count .num{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold);line-height:1}
.place-count .lbl{font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:0.1em;text-transform:uppercase}

.cat-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{white-space:nowrap;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif}
.paris .cat-tab.active{background:#BF3B3B;border-color:#BF3B3B;color:white;font-weight:600}
.london .cat-tab.active{background:#C41E3A;border-color:#C41E3A;color:white;font-weight:600}
.cat-tab:hover:not(.active){background:rgba(255,255,255,0.09);color:rgba(255,255,255,0.75)}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px}

.section-label{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.section-label .line{flex:1;height:1px;background:rgba(0,0,0,0.07)}
.section-label .text{font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.28);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:2px}

.card{background:white;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,0.05);box-shadow:0 1px 8px rgba(0,0,0,0.06);transition:transform 0.12s;cursor:pointer}
.card:active{transform:scale(0.97)}

.card-img-inner{width:100%;height:110px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.card-img-inner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,0.38) 100%)}

.cat-badge{position:absolute;top:6px;left:6px;z-index:2;padding:2px 7px;border-radius:99px;font-size:8.5px;font-weight:700;letter-spacing:0.05em;backdrop-filter:blur(6px)}
.halal-badge{position:absolute;top:6px;right:6px;z-index:2;background:rgba(26,122,74,0.9);color:white;padding:2px 6px;border-radius:99px;font-size:8px;font-weight:700;backdrop-filter:blur(6px)}
.res-badge{position:absolute;bottom:6px;left:6px;z-index:2;padding:2px 6px;border-radius:99px;font-size:9px;font-weight:700;backdrop-filter:blur(6px);display:flex;align-items:center;gap:2px}
.res-req{background:rgba(180,30,30,0.9);color:white}
.res-rec{background:rgba(30,80,200,0.82);color:white}
.res-no{background:rgba(20,110,60,0.82);color:white}

.card-body{padding:8px 9px 9px}
.card-name{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:700;line-height:1.2;color:var(--dark);margin-bottom:2px}
.card-area{font-size:9px;color:rgba(0,0,0,0.38);margin-bottom:5px}
.card-desc{font-size:10.5px;color:rgba(0,0,0,0.52);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

/* Icon buttons */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;text-decoration:none;border:none;cursor:pointer;font-size:14px;transition:opacity 0.12s;flex-shrink:0}
.icon-btn:active{opacity:0.65}
.btn-maps{background:#E8F0FE;}
.btn-ig{background:#FFF0F5;}
.btn-tips{background:#F3F0FF;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;color:#4A35AA;border:1px solid rgba(74,53,170,0.12);width:auto;padding:0 8px}
.btn-tips.open{background:#EDE9FF}

/* Google Maps logo SVG inline */
.maps-svg{width:16px;height:16px;display:block}
/* Instagram logo */
.ig-svg{width:15px;height:15px;display:block}

.tips-panel{font-size:10.5px;color:rgba(0,0,0,0.52);background:#FDFAFF;border-radius:6px;padding:6px 8px;margin:5px 0 0;line-height:1.5;font-style:italic;border-left:2px solid rgba(100,80,200,0.3);display:none}
.tips-panel.open{display:block}

.empty{text-align:center;padding:40px 20px;color:rgba(0,0,0,0.3)}
.empty .em{font-size:34px;margin-bottom:10px}

.fab{position:fixed;bottom:20px;right:16px;z-index:200;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(0,0,0,0.25);transition:transform 0.15s;color:white}
.fab:active{transform:scale(0.94)}
.fab.paris{background:#BF3B3B}
.fab.london{background:#C41E3A}

.modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-sheet{width:100%;background:white;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto}
.modal-handle{width:32px;height:3px;background:rgba(0,0,0,0.1);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;margin-bottom:14px}
.fl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(0,0,0,0.38);margin-bottom:4px;display:block}
.fi{width:100%;border:1px solid rgba(0,0,0,0.12);border-radius:8px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;color:var(--dark);outline:none;background:#FDFAF5;margin-bottom:10px}
.fi:focus{border-color:rgba(200,169,110,0.5)}
.frow{display:flex;gap:8px}
.frow .fg{flex:1}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtn-p{flex:1;padding:12px;background:var(--dark);color:var(--gold);border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.mbtn-s{padding:12px 16px;background:#F5F3EE;border:none;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;cursor:pointer}
</style>
</head>
<body>

<div class="city-bar">
  <button class="city-btn active" data-city="paris" onclick="switchCity('paris')"><span class="city-flag">🗼</span>Paris</button>
  <button class="city-btn" data-city="london" onclick="switchCity('london')"><span class="city-flag">🇬🇧</span>London</button>
</div>

<div class="header paris" id="hdr">
  <div class="header-top">
    <div class="header-title">
      <h1 id="htitle">Paris 🌙✨</h1>
      <p id="hsub">Saeed & Salha — Honeymoon Guide</p>
    </div>
    <div class="place-count"><div class="num" id="pcount">0</div><div class="lbl">Places</div></div>
  </div>
  <div class="cat-tabs" id="catTabs"></div>
</div>

<div class="main" id="main"><div id="cards"></div></div>

<button class="fab paris" id="fab" onclick="openModal()">＋</button>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Add a Place</div>
    <div class="frow">
      <div class="fg"><label class="fl">City</label><select class="fi" id="mCity"><option value="paris">🗼 Paris</option><option value="london">🇬🇧 London</option></select></div>
      <div class="fg"><label class="fl">Category</label><select class="fi" id="mCat"><option>Breakfast</option><option>Café</option><option>Bakery</option><option>Lunch</option><option>Dinner</option><option>Halal</option><option>Attraction</option><option>Museum</option><option>Park</option><option>Shopping</option><option>Photo Spot</option><option>Romantic</option><option>Hidden Gem</option><option>Viewpoint</option></select></div>
    </div>
    <label class="fl">Place Name *</label><input class="fi" id="mName" placeholder="e.g. Sketch London">
    <label class="fl">Area</label><input class="fi" id="mArea" placeholder="e.g. Mayfair">
    <label class="fl">Description</label><input class="fi" id="mDesc" placeholder="What makes it special?">
    <label class="fl">Tips / Notes</label><input class="fi" id="mTips" placeholder="Insider tip…">
    <div class="frow">
      <div class="fg"><label class="fl">Google Maps URL</label><input class="fi" id="mMaps" placeholder="https://maps.google.com/…"></div>
      <div class="fg"><label class="fl">Instagram</label><input class="fi" id="mIg" placeholder="@placename"></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">Reservation?</label><select class="fi" id="mRes"><option value="No">No</option><option value="Yes">Yes — Required</option><option value="Recommended">Recommended</option></select></div>
      <div class="fg"><label class="fl">Halal?</label><select class="fi" id="mHalal"><option value="">No info</option><option value="yes">✅ Halal</option><option value="friendly">🟡 Friendly</option></select></div>
    </div>
    <div class="mbtns"><button class="mbtn-s" onclick="closeModal()">Cancel</button><button class="mbtn-p" onclick="savePlace()">Save Place</button></div>
  </div>
</div>

// ── STATE ────────────────────────────────────────────────────────────────────
let city='paris', activeCat='all';
function data(){
  let base=[...(city==='paris'?PARIS:LONDON)];
  try{const e=JSON.parse(localStorage.getItem(city+'_extra')||'[]');if(e.length)base=base.concat([{sec:'⭐ MY ADDITIONS'},...e]);}catch(e){}
  return base;
}
function places(){return data().filter(d=>!d.sec)}

// ── TABS ─────────────────────────────────────────────────────────────────────
function buildTabs(){
  const cats=[...new Set(places().map(p=>p.cat))];
  document.getElementById('catTabs').innerHTML=
    `<button class="cat-tab active" onclick="setCat('all',this)">✦ All</button>`+
    cats.map(c=>{const m=cm(c);return`<button class="cat-tab" onclick="setCat('${c}',this)">${m.emoji} ${m.label}</button>`}).join('');
}
function setCat(c,el){document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');activeCat=c;render();}

// ── CITY SWITCH ───────────────────────────────────────────────────────────────
function switchCity(c){
  city=c;activeCat='all';
  document.querySelectorAll('.city-btn').forEach(b=>b.classList.toggle('active',b.dataset.city===c));
  const isL=c==='london';
  const hdr=document.getElementById('hdr');hdr.className='header '+(isL?'london':'paris');
  document.getElementById('fab').className='fab '+(isL?'london':'paris');
  document.getElementById('htitle').innerHTML=isL?'<span>London</span> 🇬🇧':'Paris 🌙✨';
  document.getElementById('hsub').textContent=isL?'Saeed & Salha — London Guide':'Saeed & Salha — Honeymoon Guide';
  buildTabs();render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const all=data();
  const filtered=places().filter(p=>activeCat==='all'||p.cat===activeCat);
  document.getElementById('pcount').textContent=places().length;
  const container=document.getElementById('cards');
  if(filtered.length===0){container.innerHTML=`<div class="empty"><div class="em">🔍</div><p>Nothing in this category yet.</p></div>`;return;}
  let html='';
  if(activeCat==='all'){
    const sO=[];const sM={};let cur='';
    all.forEach(d=>{if(d.sec){cur=d.sec;if(!sM[cur]){sO.push(cur);sM[cur]=[];}}else if(cur)sM[cur].push(d);});
    sO.forEach(s=>{
      const rows=sM[s];if(!rows||!rows.length)return;
      html+=`<div class="section-label"><div class="line"></div><div class="text">${s}</div><div class="line"></div></div><div class="grid">`;
      rows.forEach(p=>{html+=card(p);});
      html+=`</div>`;
    });
  }else{
    html=`<div class="grid">`;filtered.forEach(p=>{html+=card(p);});html+=`</div>`;
  }
  container.innerHTML=html;
}

// Google Maps logo SVG
const MAPS_SVG=`<svg class="maps-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#34A853"/><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13V2z" fill="#4285F4"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>`;

// Instagram logo SVG
const IG_SVG=`<svg class="ig-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ig" cx="30%" cy="107%" r="150%"><stop offset="0%" stop-color="#fdf497"/><stop offset="5%" stop-color="#fdf497"/><stop offset="45%" stop-color="#fd5949"/><stop offset="60%" stop-color="#d6249f"/><stop offset="90%" stop-color="#285AEB"/></radialGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig)"/><rect x="6" y="6" width="12" height="12" rx="3.5" fill="none" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="3" fill="none" stroke="white" stroke-width="1.5"/><circle cx="16.5" cy="7.5" r="0.8" fill="white"/></svg>`;

function card(p){
  const m=cm(p.cat);
  const photo=OP[p.name]||(PHOTOS[p.cat]||PHOTOS.default);
  const resBadge=p.res==='Yes'
    ?`<div class="res-badge res-req"><span style="font-size:11px">❗</span>Reserve</div>`
    :p.res==='Recommended'
    ?`<div class="res-badge res-rec"><span style="font-size:10px">💡</span>Recommended</div>`
    :p.res==='No'?`<div class="res-badge res-no">✓ Walk-in</div>`:'';
  const halalBadge=p.halal==='yes'?`<div class="halal-badge">🌿 HALAL</div>`:
    p.halal==='friendly'?`<div class="halal-badge" style="background:rgba(130,110,30,0.88)">🟡 FRIENDLY</div>`:'';
  const mapBtn=p.maps?`<a href="${p.maps}" target="_blank" class="icon-btn btn-maps" title="Google Maps">${MAPS_SVG}</a>`:'';
  const igH=p.ig?(p.ig.startsWith('@')?p.ig.slice(1):p.ig):'';
  const igBtn=igH?`<a href="instagram://user?username=${igH}" onclick="if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))this.href='https://instagram.com/${igH}'" class="icon-btn btn-ig" target="_blank" title="Instagram">${IG_SVG}</a>`:'';
  const tid='t_'+p.name.replace(/[^a-z0-9]/gi,'_');
  const tipsBtn=p.tips?`<button class="btn-tips icon-btn" onclick="toggleTips('${tid}',this)" title="Tips">💬</button>`:'';
  return`<div class="card">
  <div class="card-img-inner" style="background-image:url(${photo})">
    <div class="cat-badge" style="background:${m.bg};color:${m.tc}">${m.emoji} ${m.label}</div>
    ${halalBadge}${resBadge}
  </div>
  <div class="card-body">
    <div class="card-name">${p.name}</div>
    <div class="card-area">${p.area||''}</div>
    <div class="card-desc">${p.desc||''}</div>
    ${p.tips?`<div class="tips-panel" id="${tid}">${p.tips}</div>`:''}
    <div class="card-actions">${mapBtn}${igBtn}${tipsBtn}</div>
  </div>
</div>`;
}
function toggleTips(id,btn){const el=document.getElementById(id);if(!el)return;el.classList.toggle('open');btn.classList.toggle('open');}

// ── ADD PLACE ─────────────────────────────────────────────────────────────────
function openModal(){document.getElementById('mCity').value=city;document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function savePlace(){
  const name=document.getElementById('mName').value.trim();if(!name){alert('Please enter a name');return;}
  const c=document.getElementById('mCity').value;
  const p={name,cat:document.getElementById('mCat').value,area:document.getElementById('mArea').value.trim(),desc:document.getElementById('mDesc').value.trim(),tips:document.getElementById('mTips').value.trim(),maps:document.getElementById('mMaps').value.trim(),ig:document.getElementById('mIg').value.trim(),res:document.getElementById('mRes').value,halal:document.getElementById('mHalal').value};
  try{const k=c+'_extra';const e=JSON.parse(localStorage.getItem(k)||'[]');e.push(p);localStorage.setItem(k,JSON.stringify(e));}catch(e){}
  closeModal();['mName','mArea','mDesc','mTips','mMaps','mIg'].forEach(i=>document.getElementById(i).value='');
  if(c===city){buildTabs();render();}
}
// ── INIT ──────────────────────────────────────────────────────────────────────
buildTabs();render();
</script>
